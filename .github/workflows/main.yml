name: Generate Stats Images

on:
  push:
    branches: [ master ]
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

# The job commits the regenerated images back to the repository
permissions:
  contents: write

# Never let two runs race each other to push
concurrency:
  group: generate-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install requirements
      run: python3 -m pip install -r requirements.txt

    - name: Generate images
      run: python3 generate_images.py
      env:
        ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        EXCLUDED: ${{ secrets.EXCLUDED }}
        EXCLUDED_LANGS: ${{ secrets.EXCLUDED_LANGS }}
        EXCLUDE_FORKED_REPOS: false
        # Languages beyond this many are grouped as "Other" (0 shows all)
        MAX_LANGUAGES: 8

    - name: Commit to the repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add generated
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m 'Update generated files'
          git push
        fi
